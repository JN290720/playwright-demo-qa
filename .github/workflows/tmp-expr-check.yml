name: tmp-expr-check
on:
  push:
    branches: [ci/claude-trigger-prefix]
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: "誤起動1 #155 6289372845", body: "[リーダー] 回答を確認しました。**D25: 2（CLAUDE.md  … @claude …" }
          - { id: "誤起動2 #155 6289376280 (Claude の完了コメント)", body: "**Claude finished @JN290720's task i … @claude …" }
          - { id: "誤起動3 #155 6289425313", body: "[リーダー] **「GitHub 上の Claude」（claude.y … @claude …" }
          - { id: "誤起動4 #152 6289430008 (Claude の完了コメント)", body: "**Claude finished @JN290720's task i … @claude …" }
          - { id: "誤起動5 #173 6289789970", body: "[agent-reviewer] PR #173 のレビュー（読み取りの … @claude …" }
          - { id: "先頭に書く", body: "@claude 調べてください" }
          - { id: "先頭・大文字小文字違い", body: "@Claude 調べてください" }
          - { id: "先頭に半角スペース", body: " @claude 調べてください" }
          - { id: "先頭に改行", body: "\n@claude 調べてください" }
          - { id: "起動の文字なし", body: "普通のコメント" }
    steps:
      - name: evaluate
        env:
          OLD: ${{ contains(matrix.body, '@claude') }}
          NEW: ${{ startsWith(matrix.body, '@claude') }}
          ID: ${{ matrix.id }}
        run: echo "RESULT|$ID|現行(contains)=$OLD|新(startsWith)=$NEW"
