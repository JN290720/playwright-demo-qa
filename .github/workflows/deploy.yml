name: Deploy App

on:
  push:
    branches: [ main ]

# 最小権限: 既定は読み取りのみ。Pages デプロイに必要な権限は Job 単位で付与する
permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: read
      pages: write     # GitHub Pages へのデプロイ
      id-token: write  # deploy-pages の OIDC 認証
    # 通常は約 30 秒。指定が無いと既定の 360 分になり、ハングに気づけないため 10 分に制限（#19）
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
    - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
      with:
        # 公開するのは public/ の中身だけ（許可リスト方式）。
        # リポジトリ全体（'.'）を公開すると、.env.* や CLAUDE.md などが意図せず公開されるため。
        path: './public'
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # 失敗の通知（#37、ユーザー承認済み）: デプロイが失敗したら GitHub Issue を作成（既にあればコメントを追記）。
  # 成功に戻ったら、復旧を書いて閉じる。デプロイの権限（pages・id-token）を持たない、別の Job で行う（最小権限）。
  notify:
    needs: deploy
    if: ${{ always() && (needs.deploy.result == 'success' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # scripts/notify-failure.js の取得
      issues: write  # Issue の作成・コメント・クローズ
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - name: Notify via Issue
      env:
        GH_TOKEN: ${{ github.token }}
        MODE: ${{ needs.deploy.result == 'success' && 'recovery' || 'failure' }}
        NOTIFY_LABEL: deploy-failure
        NOTIFY_TITLE: '🚨 Deploy App が失敗しました (main)'
        NOTIFY_BODY: |
          デプロイ（Deploy App）の結果: **${{ needs.deploy.result }}**

          - 実行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - コミット: ${{ github.sha }}
      run: node scripts/notify-failure.js