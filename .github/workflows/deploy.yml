name: Deploy App

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        # 公開するのは public/ の中身だけ（許可リスト方式）。
        # リポジトリ全体（'.'）を公開すると、.env.* や CLAUDE.md などが意図せず公開されるため。
        path: './public'
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4