name: Deploy App

on:
  push:
    branches: [ main ]

# 最小権限: 既定は読み取りのみ。書き込みが必要な権限は Job 単位で付与する
permissions:
  contents: read

# 💡 デプロイは途中でキャンセルしません。同時には 1 つだけ実行します（#33）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: write # gh-pages ブランチへ push するため（#89）
    # 通常は約 30 秒。指定が無いと既定の 360 分になり、ハングに気づけないため 10 分に制限（#19）
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    # テスト観点表（何を、どこまでテストしているか）を、テストのコードから自動生成して、public/ に置く（#39）。
    # 手で書いた表はコードとずれていくため、デプロイのたびに作り直す
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Generate test catalog
      run: npm run catalog

    # 公開するのは public/ の中身だけ（許可リスト方式）。
    # リポジトリ全体を公開すると、.env.* や CLAUDE.md などが意図せず公開されるため。
    #
    # 💡 公開の方法（#89）: GitHub Pages の公開元は gh-pages ブランチ（本体と同じ構成）。
    #    テストレポート（main-deploy-report/ など）と同じ gh-pages に、public/ を置く。
    #    keep_files: true なので、すでにあるレポートは消えない。
    #    以前は、公開元が「GitHub Actions」で、gh-pages のレポートが配信されず 404 になっていた。
    #
    # 💡 他のワークフロー（Post-Deploy Test、PR のレポート）と gh-pages への push が競合する(cannot lock ref)ことがあるため、
    #    失敗時のみランダム待機をはさんで最大 3 回まで再試行する（test.yml と同じ）。
    - name: Deploy public/ to gh-pages (attempt 1)
      id: deploy-1
      continue-on-error: true
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        keep_files: true
        commit_message: 'deploy: app ${{ github.sha }}'

    - name: Wait before retry (attempt 2)
      if: steps.deploy-1.outcome == 'failure'
      run: sleep $((RANDOM % 20 + 5))

    - name: Deploy public/ to gh-pages (attempt 2)
      id: deploy-2
      if: steps.deploy-1.outcome == 'failure'
      continue-on-error: true
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        keep_files: true
        commit_message: 'deploy: app ${{ github.sha }}'

    - name: Wait before retry (attempt 3)
      if: steps.deploy-2.outcome == 'failure'
      run: sleep $((RANDOM % 20 + 5))

    - name: Deploy public/ to gh-pages (attempt 3)
      if: steps.deploy-2.outcome == 'failure'
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        keep_files: true
        commit_message: 'deploy: app ${{ github.sha }}'

  # テスト観点ごとの Issue（親 + 観点ごとのサブ Issue）の「テストケースの表」を、テストのコードから自動で更新する（#39）。
  # 表は、コードとずれないよう、デプロイのたびに作り直す（内容が変わらなければ、Issue は更新しない）。
  # 💡 失敗しても、Deploy App 全体は失敗にしない（continue-on-error）: 失敗にすると、後続の Post-Deploy Test が止まるため。
  #    Issue を書き換える権限（issues: write）は、デプロイ（gh-pages への書き込み）とは別の Job に分ける（最小権限）
  sync-viewpoint-issues:
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # コードの取得
      issues: write  # Issue の本文の更新
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Generate test catalog
      run: node scripts/generate-test-catalog.js reports/catalog
    - name: Sync test viewpoint issues
      env:
        GH_TOKEN: ${{ github.token }}
      run: node scripts/sync-test-viewpoint-issues.js reports/catalog/test-catalog.json

  # 失敗の通知（#37、ユーザー承認済み）: デプロイが失敗したら GitHub Issue を作成（既にあればコメントを追記）。
  # 成功に戻ったら、復旧を書いて閉じる。デプロイ（gh-pages への書き込み権限を持つ Job）とは別の Job で行う（最小権限）。
  notify:
    needs: deploy
    if: ${{ always() && (needs.deploy.result == 'success' || needs.deploy.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # scripts/notify-failure.js の取得
      issues: write  # Issue の作成・コメント・クローズ
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
    - name: Notify via Issue
      env:
        GH_TOKEN: ${{ github.token }}
        MODE: ${{ needs.deploy.result == 'success' && 'recovery' || 'failure' }}
        NOTIFY_LABEL: deploy-failure
        NOTIFY_TITLE: '🚨 Deploy App が失敗しました (main)'
        NOTIFY_BODY: |
          デプロイ（Deploy App）の結果: **${{ needs.deploy.result }}**

          - 実行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - コミット: ${{ github.sha }}
      run: node scripts/notify-failure.js
