name: Dependency Review

# 毎週月曜 9:00 JST に、依存関係の更新の「提案」を Issue（ラベル dependency-review）へ自動投稿します（#20 / #35）。
# Dependabot のバージョン更新 PR の代わりです（脆弱性アラートは、リポジトリ設定の Dependabot alerts で別に有効）。
# 選定基準: 公開から 14 日以上たった安定版 / メジャーは手動 / セキュリティ修正は例外。
on:
  schedule:
    - cron: '0 0 * * 1' # 月曜 00:00 UTC = 月曜 9:00 JST
  workflow_dispatch:     # 手動実行（動作確認用）

permissions: {}

concurrency:
  group: dependency-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # リポジトリの取得
      issues: write  # 提案の Issue（ラベル dependency-review）の作成・コメント投稿
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies (for npm audit)
        run: npm ci

      - name: Post dependency review
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/dependency-review.js --post
