name: Dependency Review

# 毎週月曜 9:00 JST に、依存関係の更新の「提案」を Backlog の固定の課題へ自動投稿します（PWQA-41。GitHub の Issue には書きません）（#20 / #35）。
# Dependabot のバージョン更新 PR の代わりです（脆弱性アラートは、リポジトリ設定の Dependabot alerts で別に有効）。
# 選定基準: 公開から 14 日以上たった安定版 / メジャーは手動 / セキュリティ修正は例外。
on:
  schedule:
    - cron: '23 0 * * 1' # 月曜 00:23 UTC = 月曜 9:23 JST（毎時 0 分は定時実行が遅れやすいため、ずらしている）
  workflow_dispatch:     # 手動実行（動作確認用）

permissions: {}

concurrency:
  group: dependency-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # リポジトリの取得
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies (for npm audit)
        run: npm ci

      - name: Post dependency review
        env:
          GH_TOKEN: ${{ github.token }}
          # 課題管理は Backlog に一本化した（PWQA-41）。書き先は Backlog だけ。
          # Backlog への投稿に失敗したとき・設定が未登録のときは、黙って飛ばさず、エラーでワークフローを失敗にする。
          # API キーは発行したユーザーの権限をそのまま持つため、定時・手動の実行だけのこのジョブに渡す（PR のジョブには渡さない）。
          # スペースの URL は、公開のログに出ないようシークレットで渡す（変数の値はログにそのまま出る）。課題キーは変数（Variables）で渡す。
          BACKLOG_API_KEY: ${{ secrets.BACKLOG_API_KEY }}
          BACKLOG_SPACE: ${{ secrets.BACKLOG_SPACE }}
          BACKLOG_DEPENDENCY_ISSUE: ${{ vars.BACKLOG_DEPENDENCY_ISSUE }}
        run: node scripts/dependency-review.js --post
