name: Post-Deploy Test

on:
  # デプロイ用ワークフロー（Deploy App）の実行完了をトリガーとして自動起動
  workflow_run:
    workflows: ["Deploy App"]
    types:
      - completed

# 最小権限: レポートを gh-pages ブランチへ push するための contents: write のみ
# (Pages のデプロイ API / OIDC は使わないため pages・id-token は不要)
permissions:
  contents: write

jobs:
  post-deploy-test:
    # -------------------------------------------------------------------------
    # 【実行条件】「Deploy App」ワークフローが「成功（success）」した場合のみテストを実行
    # デプロイがコケている場合は無駄なテスト実行を回避します
    # -------------------------------------------------------------------------
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # 通常は約 2〜3 分。ハング時に 1 時間待たずに気づけるよう 15 分に短縮（#19、ユーザー承認済み）
    timeout-minutes: 15
    runs-on: ubuntu-latest
    
    steps:
      # -----------------------------------------------------------------------
      # ステップ1: コードのチェックアウトと環境セットアップ（🚀 高速化対応）
      # -----------------------------------------------------------------------
      - uses: actions/checkout@v4

      # Node.js のセットアップ（`cache: 'npm'` により依存パッケージを自動キャッシュ）
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      # package.json の依存パッケージをインストール
      - name: Install dependencies
        run: npm ci

      # 💡 Playwright のブラウザバイナリをキャッシュ
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-post-deploy-${{ hashFiles('**/package-lock.json') }}

      # 💡 WebKit (Safari) 等の起動に必要な OS 依存ライブラリ (libevent 等) を常にインストール
      # ※ OS パッケージは Actions キャッシュ対象外となるため、キャッシュヒット時でも必ず実行します
      # 💡 apt の一時的なハング対策（#19）: 1 回 3 分で打ち切り、最大 3 回まで再試行します。
      # （過去に、このステップが約 60 分ハングして Job が打ち切られた実績があります）
      # timeout-minutes は、再試行を使い切った場合の合計より少し長い「最後の砦」です。
      - name: Install Playwright System Dependencies
        timeout-minutes: 12
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          for i in 1 2 3; do
            if timeout 180 npx playwright install-deps; then
              exit 0
            fi
            echo "::warning::install-deps attempt $i failed or timed out"
            sleep 10
          done
          echo "::error::install-deps failed after 3 attempts"
          exit 1

      # 💡 キャッシュがヒットしなかった場合のみ、ブラウザ本体（Chromium / WebKit）をダウンロード
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          for i in 1 2; do
            if timeout 240 npx playwright install chromium webkit; then
              exit 0
            fi
            echo "::warning::browser install attempt $i failed or timed out"
            sleep 10
          done
          echo "::error::browser install failed after 2 attempts"
          exit 1

      # -----------------------------------------------------------------------
      # ステップ2: 本番 URL に対する Playwright E2E テスト実行
      # -----------------------------------------------------------------------
      # 本番環境（ENV: prod）と本番ページ URL を環境変数で渡して全テストを検証します
      # 💡 html に加えて json も出力し、flaky（リトライで通ったテスト）を可視化します（#37）
      - name: Run Playwright tests
        env:
          ENV: prod
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/results.json
        run: npx playwright test --reporter=html,json

      # 💡 flaky（リトライで通ったテスト）と失敗を抽出して、Job Summary に表示します（警告のみ。CI は失敗にしません）
      - name: Summarize flaky tests
        if: always()
        run: |
          mkdir -p reports
          node scripts/summarize-flaky.js reports/results.json || true
          if [ -f reports/summary.md ]; then cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      # -----------------------------------------------------------------------
      # ステップ3: GitHub Pages デプロイ用のフォルダ構造準備
      # -----------------------------------------------------------------------
      # 「最新レポート（main-deploy-report）」と「今回実行分（main-test-<run_id>）」の
      # 2系統のディレクトリを作成し、レポートファイルをそれぞれ配置します。
      - name: Prepare Report Directories
        if: always()
        run: |
          mkdir -p ./deploy-artifacts/main-test-${{ github.run_id }}
          mkdir -p ./deploy-artifacts/main-deploy-report
          
          # 生成された HTML レポートを両方のディレクトリへ複製コピー
          cp -R ./playwright-report/* ./deploy-artifacts/main-test-${{ github.run_id }}/
          cp -R ./playwright-report/* ./deploy-artifacts/main-deploy-report/

      # -----------------------------------------------------------------------
      # ステップ4: GitHub Pages へ全レポートを一括アップロード
      # -----------------------------------------------------------------------
      # 1回のデプロイアクションで2つのレポートを同時公開（Git Push のバッティング競合を回避）
      # 💡 他のワークフローと gh-pages への push が競合する(cannot lock ref)ことがあるため、
      # 失敗時のみランダム待機をはさんで最大 3 回まで再試行します。
      - name: Deploy All Reports to GitHub Pages (attempt 1)
        id: deploy-reports-1
        if: always()
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-artifacts
          keep_files: true

      - name: Wait before retry (attempt 2)
        if: always() && steps.deploy-reports-1.outcome == 'failure'
        run: sleep $((RANDOM % 20 + 5))

      - name: Deploy All Reports to GitHub Pages (attempt 2)
        id: deploy-reports-2
        if: always() && steps.deploy-reports-1.outcome == 'failure'
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-artifacts
          keep_files: true

      - name: Wait before retry (attempt 3)
        if: always() && steps.deploy-reports-2.outcome == 'failure'
        run: sleep $((RANDOM % 20 + 5))

      - name: Deploy All Reports to GitHub Pages (attempt 3)
        if: always() && steps.deploy-reports-2.outcome == 'failure'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-artifacts
          keep_files: true

      # -----------------------------------------------------------------------
      # ステップ5: 実行ログおよび Job Summary へのリンク出力
      # -----------------------------------------------------------------------
      # Actions 実行結果画面（Summary）やコンソールログにレポート表示用 URL を出力します
      - name: Output Report URL to Summary & Log
        if: always()
        run: |
          echo "======================================================="
          echo "🎭 Latest Test Report URL:"
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/main-deploy-report/"
          echo "🎭 Run #${{ github.run_id }} Test Report URL:"
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/main-test-${{ github.run_id }}/"
          echo "======================================================="

          echo "## 🎭 Playwright Test Reports" >> $GITHUB_STEP_SUMMARY
          echo "🌟 **[最新のテストレポートを見る](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/main-deploy-report/)**" >> $GITHUB_STEP_SUMMARY
          echo "📜 **[今回の実行結果のみ見る (#${{ github.run_id }})](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/main-test-${{ github.run_id }}/)**" >> $GITHUB_STEP_SUMMARY

      # -----------------------------------------------------------------------
      # ステップ6: テスト結果（HTMLレポート）のアーティファクト保存
      # -----------------------------------------------------------------------
      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-playwright-report
          path: |
            playwright-report/
            reports/
          retention-days: 7
