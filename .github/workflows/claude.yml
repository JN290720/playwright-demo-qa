name: Claude Code

on:
  # Issue / PR のコメントで @claude とメンションされた時
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # PR レビュー本文で @claude とメンションされた時
  pull_request_review:
    types: [submitted]
  # Issue の作成時に本文・タイトルで @claude とメンションされた時
  issues:
    types: [opened, assigned]

# 最小権限: Claude が変更を push / PR 作成できるよう contents・pull-requests・issues は write
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # claude-code-action の OIDC 認証用
  actions: read   # PR の CI 結果を Claude が参照するため

jobs:
  claude:
    # @claude を含むイベントのみ実行 (無関係なコメントでの起動・課金を防ぐ)
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          # Pro / Max / Team / Enterprise のサブスクリプション認証 (claude setup-token で発行)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
