name: Workflow Lint

# 💡 GitHub Actions の設定（ワークフロー）の書き間違いを、PR の段階で検査します（actionlint）
# 目的: 書式・式・権限・存在しない入力などの誤りを、マージ前に見つけるため（今後のワークフロー変更の保険）
# 版（v1.7.12）と SHA-256 は固定。ダウンロードしたファイルは、この SHA-256 で確かめてから使う
on:
  pull_request:
    paths:
      - '.github/workflows/**'

# 最小権限: 読み取りのみ
permissions:
  contents: read

# 同じ PR に続けて push したとき、古い実行はキャンセルします
concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install actionlint (v1.7.12, SHA-256 verified)
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          curl -sSfLo "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint -color
