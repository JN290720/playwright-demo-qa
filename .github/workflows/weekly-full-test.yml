name: Weekly Full Test

# 全テスト（stg = フル検証）を、週 1 回、自動で実行する（#98）。
#
# 【目的】全テストは、これまで PR の CI でしか動かなかった。そのため、
#   ・テスト対象サイト側の修正・変更（例: test.fail() で記録した既知の不具合が直った）
#   ・サイト側の変更による、新しい不具合・見た目の変化
# が、次に PR を出すまで見つからなかった。PR を待たずに検知する。
#
# - 実行内容: ENV=staging（全テスト）。PC の Chrome / スマホ表示の Chrome / Safari（WebKit。PR 以外のイベントなので、設定により含まれる）
# - 失敗 → GitHub Issue（ラベル weekly-failure）で通知。復旧したら自動でクローズ（notify-failure.js）
# - 既知の不具合のテスト（test.fail()）が予期せず成功 → 「サイトが直った可能性」を、サイト不具合の一覧 Issue（ラベル site-defect）にコメント
# - このファイルを変更した PR でも動く（変更の検証用。通知は送らない）
# - 最新のレポートを gh-pages の weekly-report/ に上書き公開する（D35。URL: https://<owner>.github.io/<repo>/weekly-report/）。
#   履歴は残さない（過去分は成果物 weekly-playwright-report を 14 日保持）。main の実行だけで公開する（PR では触らない）
on:
  schedule:
    - cron: '37 18 * * 0' # 日曜 18:37 UTC = 月曜 3:37 JST（毎時 0 分は定時実行が遅れやすいため、ずらしている。#88）
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/weekly-full-test.yml'
      - 'scripts/notify-site-fixed.js'
      - 'scripts/summarize-perf.js'
      - 'tests-perf/**'

# 最小権限: 既定は読み取りのみ。通知（Issue）に必要な権限は Job で付与する
permissions:
  contents: read

concurrency:
  group: weekly-full-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-test:
    permissions:
      contents: write # gh-pages の weekly-report/ への公開（この Job だけ。D35）。PR のイベントでは公開しない
      issues: write # 失敗の通知（Issue の作成・コメント・クローズ）、サイト不具合の Issue へのコメント
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          # キーに、入れるブラウザ（chromium-webkit）を含める: ブラウザの構成を変えたときに、古いキャッシュに当たって、入れ直されないのを防ぐ
          key: ${{ runner.os }}-playwright-weekly-chromium-webkit-${{ hashFiles('**/package-lock.json') }}

      # WebKit (Safari) 等の起動に必要な OS 依存ライブラリ。キャッシュ対象外のため常に実行（apt のハング対策で再試行。#19）
      - name: Install Playwright System Dependencies
        timeout-minutes: 17
        run: |
          # apt の設定（全ての apt-get に効く。install-deps の内部の呼び出しには、コマンドラインの -o を付けられないため、設定ファイルで渡す）
          #   DPkg::Lock::Timeout: dpkg の lock を、最大 120 秒まで待つ（残った apt-get が lock を握っていても、次の試行が lock 待ちで即失敗しないように）
          #   Acquire::http::Timeout: 取得が 30 秒止まったら打ち切る（止まった取得を、長く待たない）
          sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null <<'APTCONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          DPkg::Lock::Timeout "120";
          APTCONF
          # apt の再試行（#152）: 試行ごとに、新しいプロセスグループで起動し、打ち切りのときはグループごと止める
          #   timeout は直接の子（npx）しか止めないため、その孫の apt-get が lock を持ったまま残っていた（#227 の run で確認）
          #   install-deps は apt-get を sudo で起動する（root のプロセス）。ランナーのユーザーの kill は権限で失敗するため、sudo で止める（#229 の下での再発・run 39945654296 で確認）
          attempt_install() {
            setsid npx playwright install-deps &
            local pid=$!
            local waited=0
            while kill -0 "$pid" 2>/dev/null; do
              if [ "$waited" -ge 300 ]; then
                echo "::warning::install-deps が 300 秒で打ち切られたため、プロセスグループ $pid ごと止めます"
                sudo kill -TERM -- "-$pid" 2>/dev/null || true
                sleep 5
                sudo kill -KILL -- "-$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                return 124
              fi
              sleep 1
              waited=$((waited + 1))
            done
            wait "$pid"
          }
          for i in 1 2 3; do
            if attempt_install; then
              exit 0
            fi
            echo "::warning::install-deps attempt $i failed or timed out"
            # 止めた途中の dpkg の状態を戻す（失敗しても続行）。lock の持ち主の確認用に、残った apt 系のプロセスを記録する
            ps -o pid,pgid,etime,args -C apt-get,dpkg || true
            sudo dpkg --configure -a || true
            sleep 10
          done
          echo "::error::install-deps failed after 3 attempts"
          exit 1

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          for i in 1 2; do
            if timeout 240 npx playwright install chromium webkit; then
              exit 0
            fi
            echo "::warning::browser install attempt $i failed or timed out"
            sleep 10
          done
          echo "::error::browser install failed after 2 attempts"
          exit 1

      - name: Run all tests (staging)
        env:
          ENV: staging
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/results.json
        run: npx playwright test --reporter=html,json

      # flaky（リトライで通ったテスト）と失敗を抽出して、Job Summary に表示する
      - name: Summarize results
        if: always()
        run: |
          mkdir -p reports
          node scripts/summarize-flaky.js reports/results.json || true
          if [ -f reports/summary.md ]; then cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      # 表示速度の記録（#136。ユーザー判断: 記録のみ。失敗にしない）: 主要な画面の表示時間を、PC の Chrome で各 5 回測り、
      # 中央値・最小・最大を Job Summary に出す（成果物 reports/perf.json にも残る）。しきい値は設けない。
      # 💡 このステップが失敗しても、Job は失敗にしない（continue-on-error）。外部サイトで、こちらでは改善できず、通信状況でぶれるため
      - name: Record performance (record only)
        if: always()
        continue-on-error: true
        run: |
          npx playwright test -c tests-perf/playwright.config.ts || echo "::warning::表示速度の記録に失敗しました（失敗にはしません）"
          node scripts/summarize-perf.js reports/perf.json >> "$GITHUB_STEP_SUMMARY" || true

      # 最新のレポートを gh-pages の weekly-report/ に上書きで公開する（D35。履歴なし）。
      # 💡 公開先は PR 用の pr-reports/ と別のフォルダ。PR のイベントでは触らない（main の実行だけ）
      # 💡 失敗しても Job は失敗にしない（continue-on-error）。失敗時は、Job Summary と失敗の通知にその旨を書く
      - name: Checkout gh-pages (weekly report)
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 1

      - name: Publish weekly report to gh-pages
        id: publish-weekly-report
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          if bash scripts/publish-weekly-report.sh pages playwright-report; then
            echo "🌟 **[最新の週次テストレポートを見る](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/weekly-report/)**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ 週次テストレポートの公開に失敗しました（成果物 weekly-playwright-report を確認してください）" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # 💡 上の公開ステップは continue-on-error のため、step の conclusion は success と表示される（実際の結果は outcome）。
      #    失敗を、ジョブのログと注釈（warning）に明記する。Job の結果は変えない（テストの結果と分けるため）
      - name: Report publish result
        if: always() && steps.publish-weekly-report.outcome == 'failure'
        run: echo "::warning::週次テストレポートの公開に失敗しました（最新のレポートの URL は使えません。成果物 weekly-playwright-report を確認）"

      # 既知の不具合のテストが予期せず成功していれば、「サイトが直った可能性」を知らせる（PR では送らない）
      - name: Notify possible site fixes
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify-site-fixed.js reports/results.json

      - name: Notify failure via Issue
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: failure
          NOTIFY_LABEL: weekly-failure
          NOTIFY_TITLE: '🚨 週次の全テストが失敗しました'
          NOTIFY_BODY: |
            週次の全テスト（Weekly Full Test）が失敗しました。サイト側の変更や不具合の可能性があります。
            （既知の不具合のテストが「予期せず成功」して失敗になっている場合は、サイトが直ったということです。サイト不具合の一覧の Issue も確認してください）

            - 実行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - 最新のレポート: ${{ steps.publish-weekly-report.outcome == 'success' && format('https://{0}.github.io/{1}/weekly-report/', github.repository_owner, github.event.repository.name) || '（公開に失敗しました。成果物 weekly-playwright-report を確認してください）' }}
            - コミット: ${{ github.sha }}
        run: node scripts/notify-failure.js

      - name: Close failure issue on recovery
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: recovery
          NOTIFY_LABEL: weekly-failure
          NOTIFY_BODY: |
            Weekly Full Test が成功しました（${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}）。
        run: node scripts/notify-failure.js

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-playwright-report
          path: |
            playwright-report/
            reports/
          retention-days: 14
