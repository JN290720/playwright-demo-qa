name: PR Test & VRT Update

on:
  # PRが作成・更新（Push）された時に自動実行
  pull_request:
    branches: [ main, master ]
  # PRのコメント欄に新しいコメントが投稿された時に実行（/update-vrt 検知用）
  issue_comment:
    types: [created]

# 最小権限: 既定は読み取りのみ。書き込みが必要な権限は Job 単位で付与する
permissions:
  contents: read

# 💡 同じ PR に続けて push したとき、古いテストの実行を自動でキャンセルします（#33）。
#    ※ このワークフローは、PR へのコメントのたびに起動します（Bot の結果コメントも含む。Job は条件で skip）。
#      コメントの実行で、実行中の /update-vrt を取り消さないよう、グループを分けます。
#      ・pull_request（push）: PR ごとのグループ。古い実行をキャンセルする
#      ・issue_comment: コメントごとに独立したグループ。キャンセルも、順番待ちの置き換えもしない
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-test-{0}', github.event.pull_request.number) || format('pr-comment-{0}', github.event.comment.id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    permissions:
      contents: write      # VRT更新画像のGit Commit & Push、およびHTMLレポート（gh-pages）のデプロイ権限
      pull-requests: write # PR画面へのステータスコメント投稿・更新権限
      issues: write        # issue_comment イベントでPRコメントおよびリアクションを操作するための権限
    # -------------------------------------------------------------------------
    # 【実行条件の制御】
    # 1. 通常のPRイベント（作成・Push）時
    # 2. または、PRに対するコメント投稿であり、かつ本文に "/update-vrt" が含まれる時
    #    ただし、コメント投稿者がリポジトリの OWNER / MEMBER / COLLABORATOR の場合のみ
    # ※無関係なIssueコメントや通常のPRコメントでの無駄なActions起動を防ぎます
    # ※書き込み権限のない第三者のコメントで、書き込み権限つきのトークンが動くことを防ぎます
    # -------------------------------------------------------------------------
    if: |
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request &&
       contains(github.event.comment.body, '/update-vrt') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))

    # 通常は約 3〜4 分。ハング時に 1 時間待たずに気づけるよう 20 分に短縮（#19、ユーザー承認済み）
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # ステップ0: コメントへの受付スタンプ（👀 リアクション）付与
      # -----------------------------------------------------------------------
      # /update-vrt コマンドを受け取ったことをユーザーに即座に伝えるため、
      # 対象のコメントに👀（Eyes）リアクションを追加します。
      - name: Add Eyes Reaction to Command Comment
        if: "github.event_name == 'issue_comment' && contains(github.event.comment.body, '/update-vrt')"
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      # -----------------------------------------------------------------------
      # ステップ1: 対象PRのブランチ名を動的に判別してチェックアウト
      # -----------------------------------------------------------------------
      # PRイベント（pull_request）とコメントイベント（issue_comment）では
      # イベントペイロードのJSON構造が異なるため、GitHub APIを使って対象PRのブランチ名（head.ref）を取得します。
      - name: Get PR Branch Name
        id: pr-branch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number
              });
              return pr.data.head.ref;
            }
            return context.payload.pull_request.head.ref;
          result-encoding: string

      # 取得したPRブランチの最新ソースコードをローカルワークスペースへ取得（Checkout）
      - name: Checkout PR Branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ steps.pr-branch.outputs.result }}

      # -----------------------------------------------------------------------
      # ステップ2: テスト実行環境のセットアップ（🚀 高速化キャッシュ対応）
      # -----------------------------------------------------------------------
      # Node.js 環境のセットアップ（`cache: 'npm'` によりパッケージを自動キャッシュ）
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # package.json の依存パッケージを高速かつ確実にインストール（キャッシュがあれば高速化）
      - name: Install dependencies
        run: npm ci

      # 💡 型チェックと lint（#21、ユーザー承認済み）: ブラウザの取得やテスト実行の前に、早く失敗させます。
      #    lint は、すべて error（違反があれば失敗）。/update-vrt の実行時は不要
      # /update-vrt の範囲の指定を解析するスクリプトの動作確認（#117）
      - name: Self-test /update-vrt parser
        if: "!contains(github.event.comment.body, '/update-vrt')"
        run: |
          # このスクリプトが入る前（古い）のブランチでは、無いので、スキップする
          if [ -f scripts/parse-update-vrt.js ]; then
            node scripts/parse-update-vrt.js --self-test
          else
            echo "このブランチには scripts/parse-update-vrt.js が無いため、スキップします（main を取り込むと実行されます）"
          fi

      - name: Type check
        if: "!contains(github.event.comment.body, '/update-vrt')"
        run: npm run typecheck

      - name: Lint
        if: "!contains(github.event.comment.body, '/update-vrt')"
        run: npm run lint

      # 💡 Playwright のブラウザバイナリ（~/.cache/ms-playwright）をキャッシュ
      # package-lock.json に変更がない限りダウンロード処理を短縮します
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-pr-${{ hashFiles('**/package-lock.json') }}

      # 💡 WebKit (Safari) 等の起動に必要な OS 依存ライブラリ (libevent 等) を常にインストール
      # ※ OS パッケージは Actions キャッシュ対象外となるため、キャッシュヒット時でも必ず実行します
      # 💡 apt の一時的なハング対策（#19）: 1 回 3 分で打ち切り、最大 3 回まで再試行します。
      # （過去に、このステップが約 60 分ハングして Job が打ち切られた実績があります）
      # timeout-minutes は、再試行を使い切った場合の合計より少し長い「最後の砦」です。
      - name: Install Playwright System Dependencies
        timeout-minutes: 12
        run: |
          # apt の設定（全ての apt-get に効く。install-deps の内部の呼び出しには、コマンドラインの -o を付けられないため、設定ファイルで渡す）
          #   DPkg::Lock::Timeout: dpkg の lock を、最大 120 秒まで待つ（残った apt-get が lock を握っていても、次の試行が lock 待ちで即失敗しないように）
          #   Acquire::http::Timeout: 取得が 30 秒止まったら打ち切る（止まった取得を、180 秒まで待たない）
          sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null <<'APTCONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          DPkg::Lock::Timeout "120";
          APTCONF
          # apt の再試行（#152）: 試行ごとに、新しいプロセスグループで起動し、打ち切りのときはグループごと止める
          #   timeout は直接の子（npx）しか止めないため、その孫の apt-get が lock を持ったまま残っていた（#227 の run で確認）
          attempt_install() {
            setsid npx playwright install-deps &
            local pid=$!
            local waited=0
            while kill -0 "$pid" 2>/dev/null; do
              if [ "$waited" -ge 180 ]; then
                echo "::warning::install-deps が 180 秒で打ち切られたため、プロセスグループ $pid ごと止めます"
                kill -TERM -- "-$pid" 2>/dev/null || true
                sleep 5
                kill -KILL -- "-$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                return 124
              fi
              sleep 1
              waited=$((waited + 1))
            done
            wait "$pid"
          }
          for i in 1 2 3; do
            if attempt_install; then
              exit 0
            fi
            echo "::warning::install-deps attempt $i failed or timed out"
            # 止めた途中の dpkg の状態を戻す（失敗しても続行）。lock の持ち主の確認用に、残った apt 系のプロセスを記録する
            ps -o pid,pgid,etime,args -C apt-get,dpkg || true
            sudo dpkg --configure -a || true
            sleep 10
          done
          echo "::error::install-deps failed after 3 attempts"
          exit 1

      # 💡 キャッシュがヒットしなかった場合のみ、ブラウザ本体（Chromium / WebKit）をダウンロード
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          for i in 1 2; do
            if timeout 240 npx playwright install chromium webkit; then
              exit 0
            fi
            echo "::warning::browser install attempt $i failed or timed out"
            sleep 10
          done
          echo "::error::browser install failed after 2 attempts"
          exit 1

      # -----------------------------------------------------------------------
      # ステップ3-A: 【通常時】Playwright テストの実行
      # -----------------------------------------------------------------------
      # 明示的に --reporter を指定し、全プロジェクト(PC/スマホ/Safari)を網羅実行します
      # 💡 html に加えて json も出力し、flaky（リトライで通ったテスト）を可視化します（#37）。
      #    ※ CLI の --reporter は config の reporter を上書きするため、ここで指定します
      - name: Run Playwright tests
        if: "!contains(github.event.comment.body, '/update-vrt')"
        id: run-tests
        env:
          ENV: staging
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/results.json
        run: npx playwright test --reporter=html,json

      # 💡 flaky（リトライで通ったテスト）と失敗を抽出して、Job Summary と PR コメントに表示します（警告のみ。CI は失敗にしません）
      - name: Summarize flaky tests
        if: "always() && !contains(github.event.comment.body, '/update-vrt')"
        run: |
          mkdir -p reports
          if [ -f scripts/summarize-flaky.js ]; then
            node scripts/summarize-flaky.js reports/results.json || true
            if [ -f reports/summary.md ]; then cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          fi

      # -----------------------------------------------------------------------
      # ステップ3-B: 【コマンド実行時】VRT（視覚テスト）スナップショット画像の自動更新
      # -----------------------------------------------------------------------
      # コメントに "/update-vrt" が含まれている場合のみ実行。
      # `--update-snapshots` フラグを付与して対象全環境（PC / スマホ / Safari）のベースライン画像を再撮影・更新します。
      # 💡 範囲の指定（#117）: `/update-vrt project=desktop-safari test=P3,P8` のように、更新するプロジェクト・画面を絞れる。
      #    指定が無ければ、今までどおり全部。コメントは、許可リスト方式で解析する（scripts/parse-update-vrt.js。シェルへそのまま渡さない）
      #    パーサは、PR のブランチではなく、**既定のブランチ（main）のもの**を使う: コメントで動くこのワークフローは main の定義で動くため、
      #    PR のブランチが古い（パーサが無い）場合でも、動くようにする（#117 のマージ後に、古いブランチで失敗した）
      - name: Checkout parser from default branch
        if: "contains(github.event.comment.body, '/update-vrt')"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .vrt-tools
          sparse-checkout: scripts/parse-update-vrt.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Parse /update-vrt options
        id: vrt-opts
        if: "contains(github.event.comment.body, '/update-vrt')"
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: node .vrt-tools/scripts/parse-update-vrt.js

      - name: Update VRT Snapshots
        if: "contains(github.event.comment.body, '/update-vrt') && steps.vrt-opts.outputs.valid == 'true'"
        env:
          ENV: staging
          VRT_PROJECTS: ${{ steps.vrt-opts.outputs.projects }}
          VRT_GREP: ${{ steps.vrt-opts.outputs.grep }}
          VRT_SCOPE: ${{ steps.vrt-opts.outputs.scope }}
        run: |
          # 検証済みの値（許可リストに合うもの）だけを、配列で渡す
          args=()
          for p in $VRT_PROJECTS; do args+=("--project=$p"); done
          if [ -n "$VRT_GREP" ]; then args+=(-g "$VRT_GREP"); fi
          echo "更新の範囲: $VRT_SCOPE"
          npx playwright test tests/saucedemo-visual-regression.spec.ts --update-snapshots "${args[@]}"
      
        # -----------------------------------------------------------------------
      # ステップ3-C: レポートディレクトリの作成・準備（空回避）
      # -----------------------------------------------------------------------
      # playwright-report が生成されていない場合でもエラーで落ちないよう、
      # 空のフォルダーとフォールバック用 index.html を確実に準備します。
      - name: Prepare Report Directory
        if: always()
        run: |
          mkdir -p ./playwright-report
          if [ ! -f "./playwright-report/index.html" ]; then
            echo "<html><body><h1>Playwright Report</h1><p>No report generated or tests passed without html reporter output.</p></body></html>" > ./playwright-report/index.html
          fi

      # -----------------------------------------------------------------------
      # ステップ4: 【コマンド実行時】更新されたスナップショット画像の Git Commit & Push
      # -----------------------------------------------------------------------
      # /update-vrt 実行によって更新された画像ファイルをPRブランチへ自動コミット＆Pushします。
      # 差分がない場合はエラーを起こさず安全にスキップし、結果情報を出力変数に保存します。
      - name: Commit & Push updated snapshots
        if: "contains(github.event.comment.body, '/update-vrt') && steps.vrt-opts.outputs.valid == 'true'"
        id: commit-vrt
        env:
          VRT_SCOPE: ${{ steps.vrt-opts.outputs.scope }}
        run: |
          # Gitコミット用のBotユーザー情報を設定
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # tests/ 配下の変更（*-snapshots フォルダ内の新旧画像）をすべてステージング
          git add -A tests/
          
          # 差分が存在する場合のみコミット＆Pushを実施（[skip ci] で無限ループロジックを防止）
          if ! git diff --staged --quiet; then
            git commit -m "chore(vrt): VRTベースライン画像を自動更新（${VRT_SCOPE}） [skip ci]"
            git push
            
            # 最新のコミットSHAハッシュと「変更あり」フラグを出力変数へセット
            NEW_SHA=$(git rev-parse HEAD)
            echo "commit_sha=${NEW_SHA}" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No snapshot changes to commit."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------------
      # ステップ5: HTMLテストレポートの GitHub Pages デプロイ
      # -----------------------------------------------------------------------
      # 💡 複数 PR が同時に走ると gh-pages への push が競合する(cannot lock ref)ため、
      # 失敗時のみランダム待機をはさんで最大 3 回まで再試行します。
      - name: Deploy Playwright Report to GitHub Pages (attempt 1)
        id: deploy-report-1
        if: "always() && !contains(github.event.comment.body, '/update-vrt')"
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: pr-reports/${{ steps.pr-branch.outputs.result }}
          keep_files: true

      - name: Wait before retry (attempt 2)
        if: "always() && steps.deploy-report-1.outcome == 'failure'"
        run: sleep $((RANDOM % 20 + 5))

      - name: Deploy Playwright Report to GitHub Pages (attempt 2)
        id: deploy-report-2
        if: "always() && steps.deploy-report-1.outcome == 'failure'"
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: pr-reports/${{ steps.pr-branch.outputs.result }}
          keep_files: true

      - name: Wait before retry (attempt 3)
        if: "always() && steps.deploy-report-2.outcome == 'failure'"
        run: sleep $((RANDOM % 20 + 5))

      - name: Deploy Playwright Report to GitHub Pages (attempt 3)
        if: "always() && steps.deploy-report-2.outcome == 'failure'"
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: pr-reports/${{ steps.pr-branch.outputs.result }}
          keep_files: true

      # -----------------------------------------------------------------------
      # ステップ6: PR画面への結果フィードバックコメント投稿
      # -----------------------------------------------------------------------
      # 状況に応じてPRコメント欄へ自動フィードバックを投稿・更新します。
      # ・/update-vrt 完了時：コミット比較ダイレクトリンク付きの返信コメントを新しく投稿
      # ・通常テスト完了時：既存のレポート案内コメントを上書き更新（新規作成）
      - name: Comment PR Status or VRT Reply
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          VRT_SCOPE: ${{ steps.vrt-opts.outputs.scope }}
          VRT_ERROR: ${{ steps.vrt-opts.outputs.error }}
        with:
          script: |
            const isVrtCommand = context.eventName === 'issue_comment' && context.payload.comment.body.includes('/update-vrt');
            const issueNumber = context.issue.number;

            if (isVrtCommand) {
              // 💡 /update-vrt コマンド完了時のレスポンス投稿処理
              const isSuccess = '${{ job.status }}' === 'success';
              const hasChanges = '${{ steps.commit-vrt.outputs.has_changes }}' === 'true';
              const optsParsed = '${{ steps.vrt-opts.outcome }}' === 'success';
              const optsValid = '${{ steps.vrt-opts.outputs.valid }}' === 'true';
              const scope = process.env.VRT_SCOPE || '全プロジェクト・全画面';
              const commitSha = '${{ steps.commit-vrt.outputs.commit_sha }}';
              let replyBody = '';

              if (optsParsed && !optsValid) {
                // 範囲の指定が不正: 何も更新していない（理由と使い方を返信する）
                replyBody = `⚠️ **\`/update-vrt\` の指定を解釈できなかったため、何も更新していません。**\n\n${process.env.VRT_ERROR}`;
              } else if (isSuccess) {
                if (hasChanges) {
                  const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${commitSha}`;
                  replyBody = `📸 **VRT Snapshots を自動更新しました！**（範囲: ${scope}）\n\n` +
                              `🔗 **画像の更新差分:** [コミット結果を表示 (${commitSha.substring(0, 7)})](${commitUrl})\n\n` +
                              `最新の画像をブランチにコミット＆Pushしました。再テストの完了をお待ちください。`;
                } else {
                  replyBody = `ℹ️ **VRT Snapshots に変更差分はありませんでした。**（範囲: ${scope}）\n既存の画像と一致しています（ピクセル単位の小さな揺れは、許容範囲内のため更新されません）。`;
                }
              } else {
                replyBody = `❌ **VRT Snapshots の自動更新に失敗しました。**\nActions ログをご確認ください。`;
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: replyBody
              });
            } else {
              // 💡 通常テスト完了時の結果テーブル＆レポートURLコメント投稿処理（既存コメントは更新）
              // 💡 flaky（リトライで通ったテスト）があれば警告表示にする（#37。CI は失敗にしない）
              const fs = require('fs');
              const readOr = (p, d) => (fs.existsSync(p) ? fs.readFileSync(p, 'utf8') : d);
              const flakyCount = Number(readOr('reports/flaky-count.txt', '0')) || 0;
              const flakySummary = readOr('reports/summary.md', '');
              const testsOk = '${{ steps.run-tests.outcome }}' === 'success';
              const status = !testsOk ? '❌ FAILED' : (flakyCount > 0 ? '⚠️ PASSED（flaky あり）' : '✅ PASSED');
              const reportUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-reports/${encodeURIComponent('${{ steps.pr-branch.outputs.result }}')}/`;
              const body = `### 🎭 Playwright Test Results (PR Check)\n` +
                           `**Status:** ${status}\n` +
                           `**PR Branch:** \`${'${{ steps.pr-branch.outputs.result }}'}\` \n` +
                           `**📊 HTML Report:** [View Test Report](${reportUrl})\n\n` +
                           (flakySummary ? `${flakySummary}\n` : '') +
                           `---\n` +
                           `📸 **VRT画像を更新したい場合:**\n` +
                           `コメント欄に \`/update-vrt\` と投稿すると、Linux環境のPC/スマホ/Safari最新画像を自動更新してPushします。\n` +
                           `範囲を絞る場合: \`/update-vrt project=desktop-safari\`（プロジェクト）、\`/update-vrt test=P3,P8\`（画面）。併用も可。`;

              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });

              const botComment = comments.find(c => c.body.includes('Playwright Test Results'));
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: body
                });
              }
            }

      # -----------------------------------------------------------------------
      # ステップ7: テスト結果（HTMLレポート）のアーティファクト保存
      # -----------------------------------------------------------------------
      # GitHub Actions の詳細画面「Artifacts」からレポートをダウンロードできるよう7日間保存します。
      - name: Upload Playwright Report Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-playwright-report
          # VRT の差分画像（失敗したときの actual / diff）も残す。成功時は 0 件のため、警告を出さない（#152）
          path: |
            playwright-report/
            reports/
            test-results/**/*-actual.png
            test-results/**/*-diff.png
          if-no-files-found: ignore
          retention-days: 7