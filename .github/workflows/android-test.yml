name: Android Emulator Test

# Android エミュレータ上の Chrome（実機の Chrome）で、見た目の確認（VRT = 画面のスクリーンショットを基準画像と比べて、
# 見た目の変化を検知するテスト）と、購入フロー 1 件の動作確認を実行する（#85）。
# PR ごとには実行しない（起動を含めて数分かかるため）。夜間と、手動実行のときだけ動く。
# このファイルや Android 関連のファイルを変更した PR でも動く（変更の検証用。失敗の通知は送らない）。
#
# 【基準画像の更新】手動実行（workflow_dispatch）で update_snapshots を true にして、更新したいブランチを選ぶ。
# CI のエミュレータで撮り直した画像を、そのブランチにコミットする（PR の /update-vrt と同じ考え方）。main では実行できない。
on:
  schedule:
    - cron: '0 18 * * *' # 毎日 03:00 JST
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: '基準画像（Android 用）を撮り直して、選んだブランチにコミットする（main では不可）'
        type: boolean
        default: false
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/android-test.yml'
      - 'scripts/android/**'
      - 'tests-android/**'
      - 'tests/fixtures/test.ts'
      - 'tests/saucedemo-visual-regression.spec.ts'

# 最小権限: 既定は読み取りのみ。失敗の通知（Issue）に必要な権限は Job で付与する
permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: android (google_apis, API 34)
    permissions:
      contents: read
      issues: write # 失敗の通知（Issue の作成・コメント・クローズ）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # エミュレータの高速化に KVM が必要（Linux ランナーで利用可能にする）
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # target は google_apis（userdebug。root 可・Chrome 入り）を使う。
      # google_apis_playstore（user ビルド）は、Chrome の command line フラグを有効にできず、初回起動画面で止まる（#85 の調査結果）
      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: UPDATE_SNAPSHOTS=${{ inputs.update_snapshots && '1' || '0' }} bash scripts/android/run-on-emulator.sh

      # 💡 flaky（リトライで通ったテスト）と失敗を抽出して、Job Summary に表示する（Android はリトライなしなので、失敗として表示される）
      - name: Summarize results
        if: always()
        run: |
          mkdir -p reports
          node scripts/summarize-flaky.js reports/android-results.json || true
          if [ -f reports/summary.md ]; then cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      # 失敗の通知（#37 と同じ仕組み）。PR では送らない（実験の失敗でノイズを出さない）
      - name: Notify failure via Issue
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: failure
          NOTIFY_LABEL: android-failure
          NOTIFY_TITLE: '🚨 Android エミュレータのテストが失敗しました (main)'
          NOTIFY_BODY: |
            Android エミュレータ上のテスト（Android Emulator Test）が失敗しました。

            - 実行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - コミット: ${{ github.sha }}
        run: node scripts/notify-failure.js

      - name: Close failure issue on recovery
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: recovery
          NOTIFY_LABEL: android-failure
          NOTIFY_BODY: |
            Android Emulator Test が成功しました（${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}）。
        run: node scripts/notify-failure.js

      # test-results/ には、見た目が変わったときの「基準・今回・差分」の画像が入る（原因の調査用）
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-report
          path: |
            playwright-report-android/
            reports/
            test-results/
            android-final-screen.png
          if-no-files-found: ignore
          retention-days: 7

      # 基準画像の更新のときだけ、撮り直した画像を、次の Job（コミット用）へ渡す
      - name: Upload updated snapshots
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-snapshots
          path: tests-android/snapshots/
          if-no-files-found: error
          retention-days: 1

  # 撮り直した基準画像を、選んだブランチにコミットする。
  # エミュレータの Job（上）には書き込み権限を与えず、コミットだけを別の Job に分ける（最小権限）
  commit-snapshots:
    if: ${{ inputs.update_snapshots && github.ref_name != 'main' }}
    needs: android
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-snapshots
          path: tests-android/snapshots/

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests-android/snapshots/
          if git diff --cached --quiet; then
            echo "基準画像に変更はありません"
            exit 0
          fi
          # [skip ci]: 自動コミットでテストが再実行されないようにする（PR の /update-vrt と同じ）
          git commit -m "test: Android の VRT 基準画像を更新する [skip ci]"
          git push
